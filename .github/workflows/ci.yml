name: CI

on:
  push:
  pull_request:

env:
  COMPOSER_NO_INTERACTION: 1

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    container:
      image: dejwcake/phpqa8.5:1
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: composer install --prefer-dist
      - run: phpcs -s --extensions=php

  phpcs-compatibility:
    name: PHPCS Compatibility
    runs-on: ubuntu-latest
    container:
      image: dejwcake/phpqa8.5:1
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: composer install --prefer-dist
      - run: phpcs --standard=.phpcs.compatibility.xml --cache=.phpcs.cache

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    container:
      image: dejwcake/phpqa8.5:1
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: composer install --prefer-dist
      - run: phpstan analyse --configuration=phpstan.neon

  phpmd:
    name: PHPMD
    runs-on: ubuntu-latest
    container:
      image: dejwcake/phpqa8.5:1
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: composer install --prefer-dist
      - run: >-
          phpmd
          ./config,./src,./tests
          text phpmd.xml
          --suffixes php
          --baseline-file phpmd.baseline.xml

  tests:
    name: Tests
    needs: [phpcs, phpcs-compatibility, phpstan, phpmd]
    runs-on: ubuntu-latest
    container:
      image: dejwcake/php8.5:1
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: composer install --prefer-dist
      - run: vendor/bin/phpunit
